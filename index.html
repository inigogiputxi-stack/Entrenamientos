<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamientos de Fútbol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrenamientos">
<style>
:root{--bg:#f5f5f4;--fg:#1c1917;--card:#fff;--bd:#d6d3d1;--ac:#2f5fb3;--red:#c9352f;--blk:#222;--g:#f1f1f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f5f5f4;--card:#292524;--bd:#44403c;--g:#33302e}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#f5f5f4;--card:#292524;--bd:#44403c;--g:#33302e}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:1500px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,5vw,38px);text-align:center;margin:30px 0}
h2{margin:0 0 12px}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:900px;margin:0 auto}
.home button{padding:34px 12px;font-size:18px;font-weight:600;border:2px solid var(--ac);background:var(--card);color:var(--fg);border-radius:12px;cursor:pointer}
.home button:hover{background:var(--ac);color:#fff}
button,select,input,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.btn.d{background:var(--red)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card)}
th{background:var(--ac);color:#fff;padding:8px;text-align:left}
td{border:1px solid var(--bd);padding:2px}
td input,td select{width:100%;border:0;background:transparent;padding:6px;min-width:60px}
.bat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.im{height:200px;border:2px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;text-align:center;color:#78716c}
.im img{width:100%;height:100%;object-fit:contain}
textarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:6px;resize:vertical}
.sh{display:grid;grid-template-columns:470px 1fr;gap:8px;min-width:1250px}
.lg{display:grid;grid-template-columns:120px 1fr;gap:2px;margin-bottom:2px}.lg img{width:120px;height:100%;object-fit:contain;background:#12204a}
.g6,.g5,.g7{display:grid;gap:2px;margin-bottom:2px}
.g6{grid-template-columns:120px repeat(5,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g7{grid-template-columns:repeat(7,1fr)}
.k{background:var(--blk);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:5px}
.r{background:#c9352f;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:8px 4px}
.r2{background:#d0605a}
.lb{font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;padding:4px;color:#222}
.y{background:#ffd966}.gr{background:#d9ead3}.pk{background:#f4cccc}.og{background:#fce5cd}
.cell{width:100%;min-height:58px;border:0;border-radius:0;resize:none;background:var(--g);color:var(--fg)}
.o{background:#fff2cc}.i{background:#d9ead3}.a{background:#f4cccc}.n{background:#fce5cd}
.cell.o,.cell.i,.cell.a,.cell.n{color:#222}
.hi{width:100%;border:1px solid var(--bd);background:var(--card);padding:5px;text-align:center}
.desc{min-height:150px;background:var(--g);padding:6px;font-size:13px;white-space:pre-wrap;overflow:auto}
.jet{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.jet div{background:#ffe599;color:#222;font-size:11px;text-align:center;padding:4px}
.jet input{border:0;background:var(--g);padding:5px;text-align:center;width:100%;min-width:0}
.slot{border:2px dashed var(--bd);height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:4px;overflow:hidden;background:var(--card)}
.slot img{max-width:100%;max-height:230px;object-fit:contain}
.plus{font-size:15px;border:0;background:none;color:var(--ac);cursor:pointer;font-weight:700}
.lt th{background:#4472c4;text-align:center;font-size:13px}.lt td{height:25px}.lt td.f{text-align:center;background:#e7eaf6;color:#222;font-size:13px}
.lt input{text-align:center;padding:3px;min-width:0;background:#cfd5ea;color:#222}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--card);border-radius:12px;padding:16px;width:min(900px,94vw);max-height:85vh;overflow:auto}
.pk2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pk2 div{border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;text-align:center}
.pk2 div:hover{border-color:var(--ac)}.pk2 img{width:100%;height:110px;object-fit:contain}
</style></head><body>

  cp().map(p=>`<tr><td style="padding:6px">${esc(p.num)}</td><td style="padding:6px">${esc(p.name)}</td><td><select data-a="${p.id}">`+['','Asiste','Permiso','S/N'].map(o=>`<option ${d[p.id]===o?'selected':''}>${o}</option>`).join('')+`</select></td></tr>`).join('')+`</table></div>`;
 }
 if(view==='ba'){

 }
 if(view==='hi'){

  a.innerHTML=back+`<h2>Historial de entrenamientos</h2>`+(L.length?`<div class="bat">${L.map(s=>{const f=s.f;return `<div class="card"><b>${esc(f.fecha||'s/f')} · Sesión ${esc(f.ses||'?')}</b><div>Semana: ${esc(f.sem||'-')} · Categoría: ${esc(f.cat||'-')}</div><div>Tipo de día: ${esc(f.tipo||'-')}</div><div>Ejercicios: ${esc(s.ex.filter(Boolean).join(', ')||'-')}</div><div class="bar" style="margin:0"><button class="btn" data-act="open" data-id="${s.id}">Abrir</button><button class="btn s" data-act="img" data-id="${s.id}">Guardar como imagen</button></div></div>`}).join('')}</div>`:'<p>Aún no hay entrenamientos. Rellena uno en "Entrenamiento".</p>');
 }
 if(view==='en'){
  if(!sess())cur=S.sessions.length?S.sessions[S.sessions.length-1].id:null;
  if(!sess())newSess();
  const s=sess(),f=s.f,pl=plOf(s);
  const I=(k,t='text',c='hi')=>`<input class="${c}" data-k="${k}" type="${t}" value="${esc(f[k])}">`;
  let L=`<table class="lt"><tr><th>DORSAL</th><th>POS</th><th>NOMBRE</th>${[1,2,3,4,5].map(n=>`<th>T${n}</th>`).join('')}</tr>`;
  for(let i=0;i<24;i++){const p=pl[i];L+=`<tr><td class="f">${p?esc(p.num):''}</td><td class="f">${p?esc(p.pos):''}</td><td class="f" style="text-align:left">${p?esc(p.name):''}</td>`+[1,2,3,4,5].map(n=>`<td>${p?`<input data-k="t_${p.id}_${n}" value="${esc(f['t_'+p.id+'_'+n])}">`:''}</td>`).join('')+`</tr>`}
  L+=`</table>`;
  const H=[['fecha','Fecha','date'],['ses','Sesión Nº','text'],['sem','Semana Nº','text'],['mac','Macrociclo','text'],['tipo','Tipo de día','text'],['jug','Jugadores','text'],['cat','Categoría/Temporada','text']];
  let R=`<div class="lg"><img src="${LOGO}" alt="Logo"><div><div class="g7">${H.map(h=>`<div class="k">${h[1]}</div>`).join('')}${H.map(h=>I(h[0],h[2])).join('')}</div><div class="g5">${C1.map(c=>`<div class="r">${c}</div>`).join('')}</div></div></div>`;
  
  ROWS.forEach(([l,c,bg])=>{R+=`<div class="g6"><div class="lb ${bg}">${l}</div>`+C1.map((_,j)=>`<textarea class="cell ${c}" data-k="${c}${j}">${esc(f[c+j])}</textarea>`).join('')+`</div>`});
  R+=`<div class="g5" style="margin-top:6px">${C2.map(c=>`<div class="k">${c}</div>`).join('')}</div><div class="g5">${C3.map(c=>`<div class="r r2">${c}</div>`).join('')}</div><div class="g5">`;
  for(let j=0;j<5;j++){

   R+=`<div><div class="desc">${e?esc(e.desc):''}</div><div class="jet"><div>Jugadores</div><div>Espacio</div><div>Tiempo</div>${['j','e','t'].map(c=>`<input data-k="${c}${j}" value="${esc(f[c+j])}">`).join('')}</div>`+
   `<div class="slot">${e?`<img src="${e.img||''}"><b>${e.id}</b><span><button class="plus" data-act="pick" data-j="${j}">Cambiar</button> <button class="plus" data-act="clr" data-j="${j}" style="color:var(--red)">Quitar</button></span>`:`<button class="plus" data-act="pick" data-j="${j}">+ Elegir ejercicio</button>`}</div></div>`}
  R+=`</div>`;
  a.innerHTML=back+`<div class="bar"><select id="ss">${S.sessions.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${esc(x.f.fecha||'s/f')} · Ses. ${esc(x.f.ses||'?')}</option>`).join('')}</select><button class="btn" data-act="news">+ Nuevo entrenamiento</button><button class="btn s" data-act="img" data-id="${cur}">Guardar como imagen</button><button class="btn d" data-act="dels">Eliminar este</button></div><div class="wrap"><div class="sh"><div>${L}</div><div>${R}</div></div></div>`;
 }
}
function openPick(j){pick=j;$('#mbox').innerHTML=`<div class="bar"><b>Elegir ejercicio</b><button class="btn s" data-act="close">Cerrar</button></div>`+(S.ex.length?`<div class="pk2">${S.ex.map(e=>`<div data-act="chosen" data-id="${e.id}"><b>${e.id}</b>${e.img?`<img src="${e.img}">`:''}<small>${esc((e.desc||'').slice(0,60))}</small></div>`).join('')}</div>`:'<p>No hay ejercicios. Créalos en "Batería ejercicios".</p>');$('#modal').style.display='flex'}
const closeM=()=>{$('#modal').style.display='none'};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset;
 if(a==='go'){view=d.v;render()}
 else if(a==='addp'){S.players.push({id:uid(),season:SEASON,num:'',name:'',pos:'',dob:'',h:'',w:''});save();render()}
 else if(a==='delp'){if(confirm('¿Eliminar jugador?')){S.players=S.players.filter(p=>p.id!==d.id);save();render()}}
 else if(a==='adde'){S.n++;S.ex.push({id:'E'+String(S.n).padStart(3,'0'),img:'',desc:''});save();render()}
 else if(a==='dele'){if(confirm('¿Eliminar ejercicio?')){S.ex=S.ex.filter(x=>x.id!==d.id);save();render()}}
 else if(a==='news'){newSess();render()}
 else if(a==='dels'){if(confirm('¿Eliminar este entrenamiento?')){S.sessions=S.sessions.filter(x=>x.id!==cur);cur=null;save();render()}}
 else if(a==='pick')openPick(+d.j);
 else if(a==='clr'){sess().ex[+d.j]=null;save();render()}
 else if(a==='chosen'){sess().ex[pick]=d.id;save();closeM();render()}
 else if(a==='close')closeM();
 else if(a==='bkx')exportBk();
 else if(a==='open'){cur=d.id;view='en';render()}
 else if(a==='img')exportImg(d.id);
});
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(d.p){const p=S.players.find(x=>x.id===d.p);if(p){p[d.f]=t.value;save()}}
 else if(d.k){sess().f[d.k]=t.value;save()}
 else if(d.e){const x=S.ex.find(q=>q.id===d.e);if(x){x.desc=t.value;save()}}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(d.a){(S.att[attDate]=S.att[attDate]||{})[d.a]=t.value;save()}
 else if(t.id==='imp'&&t.files[0]){importBk(t.files[0]);t.value=''}
 else if(t.id==='attd'){attDate=t.value||today();render()}
 else if(t.id==='ss'){cur=t.value;render()}
 else if(d.img&&t.files[0]){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const x=S.ex.find(q=>q.id===d.img);x.img=c.toDataURL('image/jpeg',.75);save();render()};im.src=r.result};r.readAsDataURL(t.files[0]);
 }
});

 const fit=(im,x,y,w,h)=>{const k=Math.min(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;c.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)};

   [1,2,3,4,5].forEach(n=>T(f['t_'+p.id+'_'+n],300+(n-1)*44+22,y+6,'#222','12px Arial','center'))}}
 // cabecera
 R(540,20,120,96,'#111c3a');if(logo)fit(logo,545,22,110,92);
 [['fecha','Fecha'],['ses','Sesión Nº'],['sem','Semana Nº'],['mac','Macrociclo'],['tipo','Tipo de día'],['jug','Jugadores'],['cat','Categoría/Temporada']].forEach(([k,l],i)=>{const x=660+i*160;R(x,20,158,22,'#222');T(l,x+79,26,'#fff','bold 11px Arial','center');R(x,44,158,26,'#fff');B(x,44,158,26);T(f[k],x+79,50,'#222','14px Arial','center')});
 C1.forEach((t,j)=>{R(660+j*224,72,222,44,'#c9352f');T(t,660+j*224+111,88,'#fff','bold 12px Arial','center')});
 const LB={y:'#ffd966',gr:'#d9ead3',pk:'#f4cccc',og:'#fce5cd'},CL={o:'#fff2cc',i:'#d9ead3',a:'#f4cccc',n:'#fce5cd'};

async function saveCanvas(cv,name){
 const url=cv.toDataURL('image/png');
 try{
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
   const r=await C.Plugins.Filesystem.writeFile({path:name,data:url.split(',')[1],directory:'CACHE'});
   await C.Plugins.Share.share({title:name,files:[r.uri]});return}
  const b=await new Promise(r=>cv.toBlob(r,'image/png')),file=new File([b],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 }catch(e){if(e&&e.name==='AbortError')return}
 $('#mbox').innerHTML=`<div class="bar"><b>${esc(name)}</b><button class="btn s" data-act="close">Cerrar</button></div><p>Si no se ha descargado, mantén pulsada la imagen (o clic derecho) y elige "Guardar imagen".</p><img src="${url}" style="width:100%">`;$('#modal').style.display='flex';
}
async function exportImg(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;const f=s.f;await saveCanvas(await drawSession(s),'entrenamiento_'+(f.fecha||'sf')+'_ses'+(f.ses||'')+'.png')}

async function exportBk(){
 const json=JSON.stringify(S),name='copia_entrenamientos_'+today()+'.json';
 try{
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
 }catch(e){if(!(e&&e.name==='AbortError'))alert('No se pudo exportar la copia.')}
}
function importBk(file){
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!Array.isArray(d.players)||!Array.isArray(d.sessions)||!Array.isArray(d.ex))throw 0;
  if(!confirm('Esto reemplaza TODOS los datos actuales por los de la copia. ¿Continuar?'))return;
  d.att=d.att||{};d.n=d.n||0;S=d;cur=null;save();view='home';render();alert('Copia importada.');
 }catch(e){alert('El archivo no es una copia válida.')}};
 r.readAsText(file);
}
